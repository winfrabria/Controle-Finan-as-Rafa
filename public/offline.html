<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#075cff" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Sem conexão | WinfraBR</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #f4f7fb;
        color: #132238;
        display: flex;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      }
      main {
        background: #fff;
        border: 1px solid #dce5f0;
        border-radius: 20px;
        box-shadow: 0 18px 50px rgba(28, 50, 79, 0.12);
        margin: auto;
        max-width: 480px;
        padding: clamp(28px, 8vw, 48px);
        text-align: center;
        width: 100%;
      }
      img { height: 64px; width: 64px; }
      h1 { font-size: clamp(1.6rem, 7vw, 2rem); margin: 24px 0 12px; }
      p { color: #52647a; line-height: 1.6; margin: 0 0 24px; }
      button {
        background: #075cff;
        border: 0;
        border-radius: 10px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 48px;
        padding: 12px 22px;
        width: 100%;
      }
      button:focus-visible { outline: 3px solid #8db5ff; outline-offset: 3px; }
      #network-status { font-size: 0.875rem; margin-top: 16px; min-height: 1.4em; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/winfra-mark-64.png" alt="" width="64" height="64" />
      <h1>Você está sem conexão</h1>
      <p>Por segurança, dados de notas e auditorias não ficam disponíveis offline. Reconecte-se para continuar.</p>
      <button type="button" id="retry">Tentar novamente</button>
      <p id="network-status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const retry = document.getElementById("retry");
      const status = document.getElementById("network-status");
      retry.addEventListener("click", () => window.location.reload());
      window.addEventListener("online", () => {
        status.textContent = "Conexão restabelecida. Tentando novamente…";
        window.location.reload();
      });
    </script>
  </body>
</html>
