# Isolated local validation stack. Never link this project to the shared database.
project_id = "winfra-harness-20260907"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 55323

[inbucket]
enabled = false
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3117"
additional_redirect_urls = ["http://localhost:3117/auth/callback"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# Enable the email provider; global auth.enable_signup=false still blocks registration.
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 55327
